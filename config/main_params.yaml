main_node:
  ros__parameters:
    package_name: "ros_gymnasium"
    # Robot parameters
    robot_name: "tb2_ugv" # Robot entity name in Gazebo
    robot_type: "circular" # rectangular or circular
    robot_radius: 0.22 # [m], if robot_type is circular
    robot_size: [0.508, 0.430] # [m, m], length and width if robot_type is rectangular
    collision_tolerance: 0.01 # [m], margin added to robot_radius or robot_size
    goal_tolerance: 0.33
    goal_observation: false # Add "goal" ([distance, angle] to the goal) to the observation

    # World parameters
    world_name: "gridworld_4x4.world" # World file from the worlds folder
    data_path: "gridworld.json" # Goals and poses file in the goals_and_poses folder

    # Task parameters
    task: 'goToPose'
    grid_size: 3.0 # [m], robot and goal spawn in a random quadrant, between 1 m and grid_size from both axes
    robot_spawn_z: 0.05 # [m], robot spawn height
    goal_spawn_z: 0.05 # [m], goal spawn height
    sparse_reward: # SparseNavEnv
      goal: 100.0
      collision: -10.0
      timeout: -5.0
    dense_reward: # DenseNavEnv
      progress_scale: 30.0 # per metre moved towards the goal
      heading_scale: 0.6 # weight of the heading-to-goal term
      collision_step: -10.0 # every step in contact with an obstacle
      goal: 1000.0
      collision: -200.0
    
    # Sensors parameters
    sensor: 'camera' # Only camera is implemented
    observation_sensors: ['depth'] # Sensors in the Dict observation: depth, scan, odom, imu (must be enabled below)
    stacked_frames: 4 # Latest readings of each observation sensor stacked in the observation, newest first

    imu_enabled: "false"
    camera_enabled: "true"
    lidar_enabled: "true"
    sensors_topic:
      rgb_topic: "/camera_color/image_raw"
      depth_topic: "/camera/depth/image_raw"
      laser_topic: "/scan"
      imu_topic: "/imu/data"
      odom_topic: "/odom"
    laser_param:
      max_distance: 2.0 # [m]
      num_points: 36 # Divisor of 360
    depth_param:
      dist_cutoff: 3.0 # [m]
      width: 160
      height: 128
      show_image: False
