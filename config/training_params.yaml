training_params:
  # Stable-Baselines3 training setup, read by scripts/go_to_pose_camera
  env_id: "SparseNavEnvDiscrete-v0" # Registered Gymnasium environment ID
  algorithm: "PPO" # PPO or A2C
  policy: "MultiInputPolicy"
  policy_kwargs:
    normalize_images: false
    features_extractor_kwargs:
      cnn_output_dim: 512
  total_timesteps: 1000000
  seed: 1

  # Keyword arguments for the SB3 algorithm (SB3 PPO defaults)
  algorithm_params:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0

  # Output
  tensorboard_log: "./results" # TensorBoard logs, one subfolder per run
  logdir: "src/Results" # Episode log written by the environment, relative to the workspace root
