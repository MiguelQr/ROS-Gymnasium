training_params:
  # Stable-Baselines3 training setup, read by scripts/go_to_pose_camera
  env_id: "SparseNavEnvDiscrete-v0" # Registered Gymnasium environment (see ros_gymnasium/register_env.py)
  algorithm: "PPO" # PPO or A2C
  policy: "CnnPolicy"
  total_timesteps: 1000000
  seed: 1

  # Keyword arguments passed to the SB3 algorithm constructor.
  # Values below are the SB3 PPO defaults; remove PPO-only keys
  # (batch_size, n_epochs, clip_range) when switching to A2C.
  algorithm_params:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0

  # Output
  tensorboard_log: "./results" # TensorBoard logs, one subfolder per run
  logdir: "src/Results" # Episode log written by the environment, relative to the workspace root
